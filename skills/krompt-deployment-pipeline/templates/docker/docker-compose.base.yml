# Base compose: app service + Caddy reverse proxy.
# Substitute {{SERVICE_NAME}}, {{IMAGE_NAME}}, {{PORT}}, {{HOST_PORT}} (optional).

services:
  {{SERVICE_NAME}}:
    image: ${IMAGE_NAME:-{{IMAGE_NAME}}}:${IMAGE_TAG:-latest}
    # For source-to-host mode, replace `image:` with `build: .`
    container_name: {{SERVICE_NAME}}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "{{PORT}}"
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:{{PORT}}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-net
    depends_on:
      {{SERVICE_NAME}}:
        condition: service_healthy

networks:
  app-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
