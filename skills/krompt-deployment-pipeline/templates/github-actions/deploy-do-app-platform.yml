# Deploy to DigitalOcean App Platform via doctl + spec file.
# Substitute {{DEPLOY_BRANCH}}, {{RUNNER}}, {{APP_ID_SECRET}} (a GH secret holding the DO app ID).

name: Deploy (DO App Platform)

on:
  push:
    branches: [{{DEPLOY_BRANCH}}]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: {{RUNNER}}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Update app from spec
        run: |
          doctl apps update ${{ secrets.{{APP_ID_SECRET}} }} \
            --spec .do/deploy.template.yaml \
            --wait
