# Deploy: registry-first build, echo-loop secrets, cloud-agnostic SSH host.
# Pattern source: control-panel-backend.
# Substitute: {{SERVICE_NAME}}, {{DEPLOY_BRANCH}}, {{RUNNER}}, {{REGISTRY}}, {{IMAGE_NAME}}, {{HOST_PATH}}, {{PORT}}

name: Deploy

on:
  push:
    branches: [{{DEPLOY_BRANCH}}]
  workflow_dispatch:

env:
  REGISTRY: {{REGISTRY}}
  IMAGE_NAME: {{IMAGE_NAME}}

jobs:
  build-and-push:
    runs-on: {{RUNNER}}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: {{RUNNER}}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd {{HOST_PATH}}

            # Login to registry on host
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Write .env from secrets (echo-loop pattern)
            echo "PORT={{PORT}}" > .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            # Add one echo per env var. Repeat for every secret your service needs.

            echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
