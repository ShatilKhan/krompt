# Fly.io app config.
# After substituting tokens, run once:  flyctl launch --copy-config --no-deploy
# Then: flyctl deploy  (git-based auto-deploy: connect repo via flyctl + Fly dashboard).
# Substitute {{SERVICE_NAME}}, {{PORT}}, {{FLY_REGION}}.

app = "{{SERVICE_NAME}}"
primary_region = "{{FLY_REGION}}"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = {{PORT}}
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Secrets: flyctl secrets set DATABASE_URL=postgres://...
